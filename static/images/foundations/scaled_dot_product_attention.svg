<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrowCyan4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#facc15"/>
    </marker>
    <marker id="arrowEmerald4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple4" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="url(#bgGrad4)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Manim Grid -->
  <g opacity="0.10" stroke="#475569" stroke-width="0.8">
    <line x1="100" y1="0" x2="100" y2="520" stroke-dasharray="4 4"/>
    <line x1="300" y1="0" x2="300" y2="520" stroke-dasharray="4 4"/>
    <line x1="500" y1="0" x2="500" y2="520" stroke-dasharray="4 4"/>
    <line x1="700" y1="0" x2="700" y2="520" stroke-dasharray="4 4"/>
    <line x1="900" y1="0" x2="900" y2="520" stroke-dasharray="4 4"/>
    <line x1="0" y1="130" x2="1000" y2="130" stroke-dasharray="4 4"/>
    <line x1="0" y1="260" x2="1000" y2="260" stroke-dasharray="4 4"/>
    <line x1="0" y1="390" x2="1000" y2="390" stroke-dasharray="4 4"/>
  </g>

  <!-- Header -->
  <text x="50" y="48" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">SCALED DOT-PRODUCT &amp; MULTI-HEAD ATTENTION</text>
  <text x="50" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Associative memory retrieval: Soft addressing over Key-Value manifolds via Queries</text>
  <rect x="750" y="32" width="200" height="28" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
  <text x="850" y="50" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">softmax(QKᵀ / √d_k) V</text>

  <!-- MAIN FLOW CONTAINER -->
  <g transform="translate(50, 105)">
    <!-- Main Card -->
    <rect width="900" height="385" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.2" filter="url(#shadow4)"/>

    <!-- INPUT TENSORS (Q, K, V) -->
    <g transform="translate(40, 30)">
      <!-- Query Q -->
      <g transform="translate(0, 0)">
        <rect width="80" height="110" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
        <text x="40" y="55" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">Q</text>
        <text x="40" y="80" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Query</text>
        <text x="40" y="130" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">T × d_k</text>
      </g>

      <!-- Key K -->
      <g transform="translate(110, 0)">
        <rect width="80" height="110" rx="6" fill="#0f172a" stroke="#facc15" stroke-width="1.8"/>
        <text x="40" y="55" fill="#facc15" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">K</text>
        <text x="40" y="80" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Key</text>
        <text x="40" y="130" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">T × d_k</text>
      </g>

      <!-- MatMul Symbol 1 -->
      <circle cx="115" cy="180" r="16" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
      <text x="115" y="185" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">×</text>

      <!-- Connection Lines from Q and K to MatMul -->
      <path d="M 40 140 L 40 180 L 95 180" fill="none" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowCyan4)"/>
      <path d="M 150 140 L 150 180 L 135 180" fill="none" stroke="#facc15" stroke-width="1.5" marker-end="url(#arrowGold4)"/>

      <!-- MatMul Output Arrow to Pipeline -->
      <path d="M 115 198 L 115 230 L 220 230" fill="none" stroke="#f8fafc" stroke-width="1.5" marker-end="url(#arrowCyan4)"/>
    </g>

    <!-- PROCESSING PIPELINE (HORIZONTAL STEPS) -->
    <g transform="translate(260, 180)">
      <!-- Box 1: Scale -->
      <g transform="translate(0, 0)">
        <rect width="115" height="70" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
        <text x="57" y="32" fill="#818cf8" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">Scale</text>
        <text x="57" y="52" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">1 / √d_k</text>
      </g>

      <!-- Arrow 1 to 2 -->
      <path d="M 118 35 L 148 35" stroke="#475569" stroke-width="2" marker-end="url(#arrowPurple4)"/>

      <!-- Box 2: Mask (Opt.) -->
      <g transform="translate(150, 0)">
        <rect width="115" height="70" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
        <text x="57" y="32" fill="#f43f5e" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">Causal Mask</text>
        <text x="57" y="52" fill="#fda4af" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">-∞ upper-tri</text>
      </g>

      <!-- Arrow 2 to 3 -->
      <path d="M 268 35 L 298 35" stroke="#475569" stroke-width="2" marker-end="url(#arrowPurple4)"/>

      <!-- Box 3: Softmax -->
      <g transform="translate(300, 0)">
        <rect width="115" height="70" rx="8" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.8"/>
        <text x="57" y="32" fill="#c084fc" font-family="ui-monospace, monospace" font-size="12" font-weight="700" text-anchor="middle">Softmax</text>
        <text x="57" y="52" fill="#e9d5ff" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">row-wise Σ=1</text>
      </g>

      <!-- Attention Matrix Heatmap Display -->
      <text x="210" y="100" fill="#c084fc" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">Attention Matrix A ∈ ℝ^(T × T)</text>

      <!-- Arrow to Value MatMul -->
      <path d="M 418 35 L 450 35" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple4)"/>
    </g>

    <!-- VALUE TENSOR V & FINAL MULTIPLICATION -->
    <g transform="translate(730, 30)">
      <!-- Value V -->
      <g transform="translate(0, 0)">
        <rect width="80" height="110" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.8"/>
        <text x="40" y="55" fill="#34d399" font-family="ui-monospace, monospace" font-size="18" font-weight="700" text-anchor="middle">V</text>
        <text x="40" y="80" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Value</text>
        <text x="40" y="130" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">T × d_v</text>
      </g>

      <!-- MatMul Symbol 2 -->
      <circle cx="40" cy="185" r="16" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
      <text x="40" y="190" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">×</text>

      <!-- Connection from V to MatMul -->
      <path d="M 40 140 L 40 165" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowEmerald4)"/>

      <!-- MatMul Output Arrow to Final Output -->
      <path d="M 40 205 L 40 245" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald4)"/>

      <!-- FINAL OUTPUT TENSOR -->
      <g transform="translate(-10, 255)">
        <rect width="100" height="90" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
        <text x="50" y="42" fill="#a7f3d0" font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">Output O</text>
        <text x="50" y="65" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">Contextualized</text>
        <text x="50" y="80" fill="#34d399" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">T × d_v</text>
      </g>
    </g>

    <!-- BOTTOM CALLOUT: MULTI-HEAD & GQA -->
    <g transform="translate(40, 315)">
      <rect width="640" height="45" rx="8" fill="#090d16" stroke="#334155" stroke-width="1"/>
      <text x="20" y="27" fill="#facc15" font-family="ui-monospace, monospace" font-size="11" font-weight="700">MULTI-HEAD:</text>
      <text x="120" y="27" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">Concat(head₁, ..., head_h) W_O  •  MQA: 1 KV head  •  GQA: Grouped KV heads (Llama 3)</text>
    </g>
  </g>
</svg>
