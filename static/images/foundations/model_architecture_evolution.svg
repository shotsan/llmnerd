<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrowM5" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" rx="16" fill="url(#bgGrad5)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Manim Grid -->
  <g opacity="0.08" stroke="#475569" stroke-width="0.8">
    <line x1="100" y1="0" x2="100" y2="560" stroke-dasharray="4 4"/>
    <line x1="300" y1="0" x2="300" y2="560" stroke-dasharray="4 4"/>
    <line x1="500" y1="0" x2="500" y2="560" stroke-dasharray="4 4"/>
    <line x1="700" y1="0" x2="700" y2="560" stroke-dasharray="4 4"/>
    <line x1="900" y1="0" x2="900" y2="560" stroke-dasharray="4 4"/>
  </g>

  <!-- Title -->
  <text x="50" y="44" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">THE ARCHITECTURAL EVOLUTION OF LANGUAGE MODELS</text>
  <text x="50" y="66" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">From 2017 Sequence Transduction to Dense Decoders, MoEs, MLA, and Diffusion Paradigms</text>
  <rect x="760" y="30" width="190" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="855" y="47" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">PARADIGM TIMELINE</text>

  <!-- ROOT: ORIGINAL TRANSFORMER (2017) -->
  <g transform="translate(370, 95)">
    <rect width="260" height="65" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow5)"/>
    <text x="130" y="26" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">ORIGINAL TRANSFORMER (2017)</text>
    <text x="130" y="44" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Encoder-Decoder Stack</text>
    <text x="130" y="58" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">Vaswani et al. • Cross-Attention</text>
  </g>

  <!-- BRANCH LINES FROM 2017 -->
  <path d="M 430 160 L 160 215" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 500 160 L 500 215" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 570 160 L 840 215" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- EPOCH 1: THE THREE BRANCHES (2018-2020) -->
  <!-- 1A: ENCODER-ONLY (BERT) -->
  <g transform="translate(50, 220)">
    <rect width="220" height="85" rx="8" fill="url(#cardGrad5)" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow5)"/>
    <text x="110" y="24" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">ENCODER-ONLY (2018)</text>
    <text x="110" y="44" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">BERT / RoBERTa</text>
    <text x="110" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Bidirectional Context • Masked LM</text>
    <text x="110" y="75" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Natural Language Understanding</text>
  </g>

  <!-- 1B: UNIFIED ENCODER-DECODER (T5) -->
  <g transform="translate(390, 220)">
    <rect width="220" height="85" rx="8" fill="url(#cardGrad5)" stroke="#facc15" stroke-width="1.2" filter="url(#shadow5)"/>
    <text x="110" y="24" fill="#facc15" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">ENCODER-DECODER (2019)</text>
    <text x="110" y="44" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">T5 / BART</text>
    <text x="110" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Text-to-Text Universal Formulation</text>
    <text x="110" y="75" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Relative Position • Span Corruption</text>
  </g>

  <!-- 1C: CAUSAL DECODER-ONLY (GPT) -->
  <g transform="translate(730, 220)">
    <rect width="220" height="85" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.8" filter="url(#shadow5)"/>
    <text x="110" y="24" fill="#c084fc" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">DECODER-ONLY (2018-2020)</text>
    <text x="110" y="44" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">GPT-1 / 2 / 3</text>
    <text x="110" y="62" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-size="10" text-anchor="middle">Autoregressive Causal Next-Token</text>
    <text x="110" y="75" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">★ The Generative Scaling Winner</text>
  </g>

  <!-- CONNECTION DOWN FROM DECODER-ONLY TO MODERN ERA -->
  <path d="M 840 305 L 840 340 L 500 340 L 500 365" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- EPOCH 2: MODERN DECODER FOUNDATION (2022-2024) -->
  <g transform="translate(250, 365)">
    <rect width="500" height="65" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.8" filter="url(#shadow5)"/>
    <text x="250" y="24" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">MODERN DECODER STANDARD (LLaMA / Mistral)</text>
    <text x="250" y="44" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Pre-RMSNorm  •  RoPE Rotations  •  SwiGLU FFN  •  GQA Attention</text>
    <text x="250" y="58" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">High training stability &amp; 8x KV-cache memory reduction</text>
  </g>

  <!-- BRANCH LINES FROM MODERN DECODER TO NEXT FRONTIERS -->
  <path d="M 330 430 L 160 465" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 500 430 L 500 465" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 670 430 L 840 465" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- EPOCH 3: CONTEMPORARY FRONTIERS (2024+) -->
  <!-- 3A: MOE ARCHITECTURES -->
  <g transform="translate(50, 465)">
    <rect width="220" height="75" rx="8" fill="url(#cardGrad5)" stroke="#facc15" stroke-width="1.5" filter="url(#shadow5)"/>
    <text x="110" y="22" fill="#facc15" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">SPARSE ROUTING</text>
    <text x="110" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Mixture of Experts</text>
    <text x="110" y="56" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Switch / Mixtral 8x7B</text>
    <text x="110" y="68" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">Top-k routing • Decouple FLOPs</text>
  </g>

  <!-- 3B: DEEPSEEK MLA & FINE-GRAINED MOE -->
  <g transform="translate(390, 465)">
    <rect width="220" height="75" rx="8" fill="#022c22" stroke="#34d399" stroke-width="1.8" filter="url(#shadow5)"/>
    <text x="110" y="22" fill="#34d399" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">LATENT COMPRESSION</text>
    <text x="110" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">DeepSeek (V2/V3)</text>
    <text x="110" y="56" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Multi-Head Latent Attention (MLA)</text>
    <text x="110" y="68" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">DeepSeekMoE + Shared Experts</text>
  </g>

  <!-- 3C: CONTINUOUS & DIFFUSION LANGUAGE MODELS -->
  <g transform="translate(730, 465)">
    <rect width="220" height="75" rx="8" fill="url(#cardGrad5)" stroke="#f43f5e" stroke-width="1.5" filter="url(#shadow5)"/>
    <text x="110" y="22" fill="#f43f5e" font-family="ui-monospace, monospace" font-size="10" font-weight="700" text-anchor="middle">NON-AUTOREGRESSIVE</text>
    <text x="110" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Diffusion Text Models</text>
    <text x="110" y="56" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Diffusion-LM / Plaid</text>
    <text x="110" y="68" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="9" text-anchor="middle">Parallel Denoising • Global Plans</text>
  </g>
</svg>
