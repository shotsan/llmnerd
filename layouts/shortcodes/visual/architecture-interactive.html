<div class="llm-motion-player not-prose" id="moe-motion-root">
  <!-- Header -->
  <div class="llm-motion-header">
    <div>
      <h3 class="llm-blueprint-title">Sparse Mixture-of-Experts (MoE) Top-2 Router Simulator</h3>
      <p class="llm-motion-goal">
        Step through how the Gating Router dynamically activates only k = 2 out of E = 8 SwiGLU expert networks per token, achieving 8&times; parameter capacity at 25% active FLOPs.
      </p>
    </div>

    <div class="llm-param-bar">
      <div class="llm-param-item">
        <span class="llm-param-label">Active Compute:</span>
        <span class="llm-param-val">2 / 8 Experts (25%)</span>
      </div>
    </div>
  </div>

  <!-- Stage -->
  <div class="llm-motion-stage">
    <svg id="moe-svg" viewBox="0 0 820 240" width="100%" style="max-width: 820px; height: auto; display: block;" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="816" height="236" rx="6" fill="#f5f4f0" stroke="#c2bfb6" stroke-width="1.5" />

      <!-- Input Token Box -->
      <g transform="translate(22, 84)">
        <rect width="128" height="68" rx="5" fill="#ffffff" stroke="#141413" stroke-width="1.75" />
        <text x="64" y="26" text-anchor="middle" fill="#141413" font-size="13" font-weight="700">Input Token x</text>
        <text id="moe-tok-text" x="64" y="50" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="700">def</text>
      </g>

      <line x1="150" y1="118" x2="195" y2="118" stroke="#141413" stroke-width="2" />

      <!-- Gating Router Box -->
      <g transform="translate(196, 78)">
        <rect width="142" height="80" rx="5" fill="#ffffff" stroke="#141413" stroke-width="1.75" />
        <text x="71" y="26" text-anchor="middle" fill="#141413" font-size="14" font-weight="700">Gating Router</text>
        <text x="71" y="48" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700">TopK(x &middot; W<tspan baseline-shift="sub" font-size="9">g</tspan>, k=2)</text>
        <text x="71" y="68" text-anchor="middle" fill="#141413" font-size="13" font-weight="600">Softmax Gate g<tspan baseline-shift="sub" font-size="9">i</tspan></text>
      </g>

      <!-- Dynamic Routing Wires & 8 Expert Boxes -->
      <g id="moe-wires-layer"></g>
      <g id="moe-experts-layer"></g>

      <!-- Output Weighted Sum Box -->
      <g transform="translate(652, 78)">
        <rect width="148" height="80" rx="5" fill="#fef2f2" stroke="#991b1b" stroke-width="2" />
        <text x="74" y="26" text-anchor="middle" fill="#141413" font-size="14" font-weight="700">MoE Output y</text>
        <text id="moe-out-formula" x="74" y="48" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="700">0.64&middot;E₂ + 0.36&middot;E₇</text>
        <text x="74" y="68" text-anchor="middle" fill="#141413" font-size="13" font-weight="600">6 Experts Dormant</text>
      </g>
    </svg>
  </div>

  <!-- Caption -->
  <div class="llm-motion-caption">
    <span id="moe-caption-text"></span>
    <span class="llm-focus-pill" id="moe-token-badge">Token 1 / 4</span>
  </div>

  <!-- Controls -->
  <div class="llm-motion-controls">
    <div class="llm-btn-group">
      <button type="button" class="llm-btn-play" id="moe-play-btn">
        <span id="moe-play-icon">&#9654;</span>
        <span id="moe-play-label">Play Token Stream</span>
      </button>
      <button type="button" class="llm-btn-step" id="moe-prev-btn">&larr; Prev Token</button>
      <button type="button" class="llm-btn-step" id="moe-next-btn">Next Token &rarr;</button>
    </div>

    <div class="llm-scrubber-group">
      <span class="llm-scrubber-label">Select Token:</span>
      <input type="range" id="moe-scrubber" class="llm-scrubber" min="0" max="3" step="1" value="0">
    </div>
  </div>
</div>

<script>
(function() {
  const expertNames = [
    'E₁ (Syntax)',
    'E₂ (Python/Code)',
    'E₃ (Math/Logic)',
    'E₄ (Entities)',
    'E₅ (Prose/Style)',
    'E₆ (Multilingual)',
    'E₇ (Algorithms)',
    'E₈ (Punctuation)'
  ];

  const samples = [
    {
      token: 'def',
      top: [1, 6],
      weights: [0.64, 0.36],
      formula: '0.64·E₂ + 0.36·E₇',
      caption: '<strong>Token <code>def</code> (Python Keyword):</strong> Router activates <strong>Expert #2 (Code)</strong> with weight 0.64 and <strong>Expert #7 (Algorithms)</strong> with weight 0.36. The other 6 experts consume zero compute.'
    },
    {
      token: '∫xdx',
      top: [2, 6],
      weights: [0.72, 0.28],
      formula: '0.72·E₃ + 0.28·E₇',
      caption: '<strong>Token <code>∫xdx</code> (Calculus Expression):</strong> Router dispatches token to <strong>Expert #3 (Math/Logic)</strong> (0.72) and <strong>Expert #7 (Algorithms)</strong> (0.28).'
    },
    {
      token: 'Shakespeare',
      top: [3, 4],
      weights: [0.58, 0.42],
      formula: '0.58·E₄ + 0.42·E₅',
      caption: '<strong>Token <code>Shakespeare</code> (Named Entity):</strong> Router selects <strong>Expert #4 (Entities)</strong> (0.58) and <strong>Expert #5 (Prose/Style)</strong> (0.42).'
    },
    {
      token: 'bonjour',
      top: [5, 0],
      weights: [0.69, 0.31],
      formula: '0.69·E₆ + 0.31·E₁',
      caption: '<strong>Token <code>bonjour</code> (French Greeting):</strong> Router routes to <strong>Expert #6 (Multilingual)</strong> (0.69) and <strong>Expert #1 (Syntax)</strong> (0.31).'
    }
  ];

  let curIdx = 0;
  let timer = null;

  const tokText = document.getElementById('moe-tok-text');
  const outFormula = document.getElementById('moe-out-formula');
  const wiresLayer = document.getElementById('moe-wires-layer');
  const expertsLayer = document.getElementById('moe-experts-layer');
  const captionEl = document.getElementById('moe-caption-text');
  const badgeEl = document.getElementById('moe-token-badge');
  const scrubber = document.getElementById('moe-scrubber');
  const playBtn = document.getElementById('moe-play-btn');
  const playIcon = document.getElementById('moe-play-icon');
  const playLabel = document.getElementById('moe-play-label');

  function renderSample(idx) {
    curIdx = idx;
    scrubber.value = idx;
    const s = samples[idx];
    tokText.textContent = s.token;
    outFormula.textContent = s.formula;
    captionEl.innerHTML = s.caption;
    badgeEl.textContent = 'Token ' + (idx + 1) + ' / 4';

    let wiresHtml = '';
    let expHtml = '';

    for (let i = 0; i < 8; i++) {
      const y = 12 + i * 27;
      const centerY = y + 12;
      const topPos = s.top.indexOf(i);
      const isSelected = topPos !== -1;
      const w = isSelected ? s.weights[topPos] : 0;

      const strokeCol = isSelected ? '#991b1b' : '#c2bfb6';
      const strokeW = isSelected ? '2.4' : '1.2';
      const dash = isSelected ? '' : 'stroke-dasharray="3 3"';

      wiresHtml += '<path d="M 338 118 L 406 ' + centerY + '" stroke="' + strokeCol + '" stroke-width="' + strokeW + '" ' + dash + ' fill="none" />';
      wiresHtml += '<path d="M 602 ' + centerY + ' L 652 118" stroke="' + strokeCol + '" stroke-width="' + strokeW + '" ' + dash + ' fill="none" />';

      const bg = isSelected ? '#fef2f2' : '#ffffff';
      const bdr = isSelected ? '#991b1b' : '#c2bfb6';
      const txtCol = isSelected ? '#991b1b' : '#141413';
      const badgeTxt = isSelected ? ('g=' + w.toFixed(2)) : '0.00';

      expHtml += '<g transform="translate(406, ' + y + ')">';
      expHtml += '<rect width="196" height="24" rx="4" fill="' + bg + '" stroke="' + bdr + '" stroke-width="' + (isSelected ? '2' : '1.2') + '" />';
      expHtml += '<text x="8" y="16" fill="' + txtCol + '" font-size="13" font-weight="' + (isSelected ? '700' : '600') + '">' + expertNames[i] + '</text>';
      expHtml += '<text x="188" y="16" text-anchor="end" fill="' + txtCol + '" font-size="13" font-weight="700">' + badgeTxt + '</text>';
      expHtml += '</g>';
    }

    wiresLayer.innerHTML = wiresHtml;
    expertsLayer.innerHTML = expHtml;
  }

  function stopAnim() {
    if (timer) {
      clearInterval(timer);
      timer = null;
    }
    playIcon.innerHTML = '&#9654;';
    playLabel.textContent = 'Play Token Stream';
  }

  playBtn.addEventListener('click', function() {
    if (timer) {
      stopAnim();
    } else {
      playIcon.innerHTML = '&#10074;&#10074;';
      playLabel.textContent = 'Pause';
      timer = setInterval(function() {
        renderSample((curIdx + 1) % samples.length);
      }, 1900);
    }
  });

  document.getElementById('moe-prev-btn').addEventListener('click', function() {
    stopAnim();
    renderSample((curIdx + samples.length - 1) % samples.length);
  });

  document.getElementById('moe-next-btn').addEventListener('click', function() {
    stopAnim();
    renderSample((curIdx + 1) % samples.length);
  });

  scrubber.addEventListener('input', function() {
    stopAnim();
    renderSample(parseInt(scrubber.value, 10));
  });

  renderSample(0);
})();
</script>
