<div class="llm-blueprint not-prose">
  <div class="llm-blueprint-header">
    <div class="llm-blueprint-title-wrap">
      <span class="llm-badge llm-badge-blue">Architecture Blueprint</span>
      <h3 class="llm-blueprint-title">Scaled Dot-Product Attention Dataflow</h3>
    </div>
    <span class="llm-blueprint-meta">O(T<sup>2</sup> &middot; d<sub>k</sub>) Compute &bull; Exact Tensor Shapes</span>
  </div>

  <div class="llm-blueprint-body">
    <svg viewBox="0 0 920 330" width="100%" style="max-width: 900px; height: auto; display: block; user-select: none;" xmlns="http://www.w3.org/2000/svg">
      <style>
        .bp-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
        .bp-card-mask { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 3; }
        .bp-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 700; }
        .bp-sub { fill: #475569; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 600; }
        .bp-wire { stroke: #64748b; stroke-width: 2; fill: none; }
        .bp-wire-blue { stroke: #2563eb; stroke-width: 2.2; fill: none; }
        .bp-wire-slate { stroke: #334155; stroke-width: 2.2; fill: none; }
        .bp-pill { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
        .bp-pill-txt { fill: #334155; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: 700; }
        .bp-stage-lbl { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }

        html.dark .bp-card { fill: #1e293b; stroke: #475569; }
        html.dark .bp-card-mask { fill: #0f172a; stroke: #64748b; }
        html.dark .bp-title { fill: #f8fafc; }
        html.dark .bp-sub { fill: #cbd5e1; }
        html.dark .bp-wire { stroke: #94a3b8; }
        html.dark .bp-pill { fill: #0f172a; stroke: #334155; }
        html.dark .bp-pill-txt { fill: #e2e8f0; }
        html.dark .bp-stage-lbl { fill: #94a3b8; }
      </style>

      <defs>
        <marker id="bp-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b" />
        </marker>
        <marker id="bp-arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
        </marker>
        <marker id="bp-arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
        </marker>
      </defs>

      <!-- Top Phase Headers -->
      <text x="58" y="22" text-anchor="middle" class="bp-stage-lbl">Input</text>
      <text x="195" y="22" text-anchor="middle" class="bp-stage-lbl">1. Subspace Projections</text>
      <text x="345" y="22" text-anchor="middle" class="bp-stage-lbl">2. Dot Product</text>
      <text x="470" y="22" text-anchor="middle" class="bp-stage-lbl">3. Scale</text>
      <text x="590" y="22" text-anchor="middle" class="bp-stage-lbl">4. Mask</text>
      <text x="712" y="22" text-anchor="middle" class="bp-stage-lbl">5. Normalize</text>
      <text x="842" y="22" text-anchor="middle" class="bp-stage-lbl">6. Aggregate</text>

      <!-- Input X (Deep Slate) -->
      <g transform="translate(14, 132)">
        <rect width="88" height="64" rx="9" fill="#1e293b" />
        <text x="44" y="28" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700" font-family="sans-serif">Input X</text>
        <text x="44" y="47" text-anchor="middle" fill="#cbd5e1" font-size="10.5" font-family="monospace">[T × d<tspan dy="2.5" font-size="8.5">model</tspan><tspan dy="-2.5">]</tspan></text>
      </g>

      <!-- Wires from X to Q, K, V -->
      <path d="M 102 150 L 120 150 Q 130 150 130 135 L 130 82 Q 130 68 140 68 L 146 68" class="bp-wire-blue" marker-end="url(#bp-arr-blue)" />
      <path d="M 102 164 L 146 164" class="bp-wire-blue" marker-end="url(#bp-arr-blue)" />
      <path d="M 102 178 L 120 178 Q 130 178 130 193 L 130 246 Q 130 260 140 260 L 146 260" class="bp-wire-slate" marker-end="url(#bp-arr-slate)" />

      <!-- Q, K, V Boxes (Unified Blue & Slate Theme) -->
      <g transform="translate(148, 38)">
        <rect width="102" height="58" rx="9" fill="#2563eb" />
        <text x="51" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700" font-family="sans-serif">Queries (Q)</text>
        <text x="51" y="42" text-anchor="middle" fill="#dbeafe" font-size="10.5" font-family="monospace">X·W<tspan dy="2.5" font-size="8.5">Q</tspan><tspan dy="-2.5"> [T×d</tspan><tspan dy="2.5" font-size="8.5">k</tspan><tspan dy="-2.5">]</tspan></text>
      </g>

      <g transform="translate(148, 135)">
        <rect width="102" height="58" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
        <text x="51" y="24" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700" font-family="sans-serif">Keys (K)</text>
        <text x="51" y="42" text-anchor="middle" fill="#1d4ed8" font-size="10.5" font-weight="600" font-family="monospace">X·W<tspan dy="2.5" font-size="8.5">K</tspan><tspan dy="-2.5"> [T×d</tspan><tspan dy="2.5" font-size="8.5">k</tspan><tspan dy="-2.5">]</tspan></text>
      </g>

      <g transform="translate(148, 232)">
        <rect width="102" height="58" rx="9" fill="#334155" />
        <text x="51" y="24" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700" font-family="sans-serif">Values (V)</text>
        <text x="51" y="42" text-anchor="middle" fill="#e2e8f0" font-size="10.5" font-family="monospace">X·W<tspan dy="2.5" font-size="8.5">V</tspan><tspan dy="-2.5"> [T×d</tspan><tspan dy="2.5" font-size="8.5">v</tspan><tspan dy="-2.5">]</tspan></text>
      </g>

      <!-- Wires from Q and K to S = QK^T -->
      <path d="M 250 67 L 278 67 Q 288 67 288 79 L 288 100" class="bp-wire-blue" marker-end="url(#bp-arr-blue)" />
      <path d="M 250 164 L 278 164 Q 288 164 288 152 L 288 134" class="bp-wire-blue" marker-end="url(#bp-arr-blue)" />

      <!-- Stage 2: MatMul QK^T -->
      <g transform="translate(292, 86)">
        <rect width="104" height="58" rx="9" class="bp-card" />
        <text x="52" y="24" text-anchor="middle" class="bp-title">Scores (S)</text>
        <text x="52" y="42" text-anchor="middle" class="bp-sub">Q · K<tspan dy="-4" font-size="8.5">T</tspan><tspan dy="4"> [T × T]</tspan></text>
      </g>

      <line x1="396" y1="115" x2="420" y2="115" class="bp-wire" marker-end="url(#bp-arr)" />

      <!-- Stage 3: Scale -->
      <g transform="translate(422, 86)">
        <rect width="96" height="58" rx="9" class="bp-card" />
        <text x="48" y="24" text-anchor="middle" class="bp-title">Scale</text>
        <text x="48" y="42" text-anchor="middle" class="bp-sub">S / √d<tspan dy="2.5" font-size="8.5">k</tspan></text>
      </g>

      <line x1="518" y1="115" x2="540" y2="115" class="bp-wire" marker-end="url(#bp-arr)" />

      <!-- Stage 4: Causal Mask (Subtle Dashed Slate Card) -->
      <g transform="translate(542, 86)">
        <rect width="98" height="58" rx="9" class="bp-card-mask" />
        <text x="49" y="24" text-anchor="middle" class="bp-title">Causal Mask</text>
        <text x="49" y="42" text-anchor="middle" class="bp-sub">+ M (j &gt; i = -∞)</text>
      </g>

      <line x1="640" y1="115" x2="662" y2="115" class="bp-wire" marker-end="url(#bp-arr)" />

      <!-- Stage 5: Softmax (Soft Cobalt Card) -->
      <g transform="translate(664, 86)">
        <rect width="100" height="58" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
        <text x="50" y="24" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700" font-family="sans-serif">Softmax (A)</text>
        <text x="50" y="42" text-anchor="middle" fill="#1d4ed8" font-size="10.5" font-weight="600" font-family="monospace">Row Σ=1 [T×T]</text>
      </g>

      <!-- Wire from Softmax A to Weighted Sum AV -->
      <path d="M 764 115 L 792 115 Q 804 115 804 130 L 804 156" class="bp-wire-blue" marker-end="url(#bp-arr-blue)" />

      <!-- Long Wire from Values V to Weighted Sum AV -->
      <path d="M 250 261 L 792 261 Q 804 261 804 244 L 804 220" class="bp-wire-slate" marker-end="url(#bp-arr-slate)" />
      <g transform="translate(465, 249)">
        <rect width="134" height="22" rx="6" class="bp-pill" />
        <text x="67" y="15" text-anchor="middle" class="bp-pill-txt">Value Payload V [T × d<tspan dy="2.5" font-size="8">v</tspan><tspan dy="-2.5">]</tspan></text>
      </g>

      <!-- Stage 6: Output O = A · V (Primary Cobalt Blue) -->
      <g transform="translate(756, 158)">
        <rect width="148" height="60" rx="9" fill="#2563eb" />
        <text x="74" y="25" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700" font-family="sans-serif">Output O = A · V</text>
        <text x="74" y="44" text-anchor="middle" fill="#dbeafe" font-size="10.5" font-family="monospace">Contextual [T × d<tspan dy="2.5" font-size="8.5">v</tspan><tspan dy="-2.5">]</tspan></text>
      </g>

      <!-- Bottom Legend Bar -->
      <g transform="translate(55, 314)">
        <circle cx="6" cy="-4" r="4.5" fill="#2563eb" />
        <text x="16" y="0" class="bp-sub">Queries Q &amp; Keys K: Subspace Matching</text>

        <circle cx="315" cy="-4" r="4.5" fill="#334155" />
        <text x="325" y="0" class="bp-sub">Values V: Information Payload</text>

        <circle cx="565" cy="-4" r="4.5" fill="#3b82f6" />
        <text x="575" y="0" class="bp-sub">Attention Map A: Row-Normalized Weights</text>
      </g>
    </svg>
  </div>
</div>
