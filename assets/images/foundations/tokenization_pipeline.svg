<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="520" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Manim Grid Pattern -->
  <g opacity="0.12" stroke="#475569" stroke-width="0.8">
    <line x1="50" y1="0" x2="50" y2="520" stroke-dasharray="4 4"/>
    <line x1="200" y1="0" x2="200" y2="520" stroke-dasharray="4 4"/>
    <line x1="350" y1="0" x2="350" y2="520" stroke-dasharray="4 4"/>
    <line x1="500" y1="0" x2="500" y2="520" stroke-dasharray="4 4"/>
    <line x1="650" y1="0" x2="650" y2="520" stroke-dasharray="4 4"/>
    <line x1="800" y1="0" x2="800" y2="520" stroke-dasharray="4 4"/>
    <line x1="950" y1="0" x2="950" y2="520" stroke-dasharray="4 4"/>
    <line x1="0" y1="100" x2="1000" y2="100" stroke-dasharray="4 4"/>
    <line x1="0" y1="200" x2="1000" y2="200" stroke-dasharray="4 4"/>
    <line x1="0" y1="300" x2="1000" y2="300" stroke-dasharray="4 4"/>
    <line x1="0" y1="400" x2="1000" y2="400" stroke-dasharray="4 4"/>
  </g>

  <!-- Title & Manim Aesthetic Header -->
  <text x="50" y="48" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">THE TOKENIZATION PIPELINE</text>
  <text x="50" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Compressing human symbolic strings into discrete vocabulary index tensors</text>
  <rect x="780" y="32" width="170" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="865" y="50" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">BYTE-PAIR ENCODING</text>

  <!-- STAGE 1: RAW STRING INPUT -->
  <g transform="translate(50, 110)">
    <rect width="890" height="64" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="24" y="38" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12" font-weight="600">INPUT STRING</text>
    <rect x="150" y="16" width="320" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="170" y="38" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="16" font-weight="600">" understanding the "</text>
    <text x="500" y="38" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="13">Arbitrary UTF-8 byte stream (unbounded discrete domain)</text>
  </g>

  <!-- CONNECTOR 1 -->
  <path d="M 495 174 L 495 204" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="491,202 495,210 499,202" fill="#38bdf8"/>

  <!-- STAGE 2: CHARACTER & BYTE SPLIT -->
  <g transform="translate(50, 215)">
    <rect width="890" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="24" y="42" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12" font-weight="600">BYTE/CHAR SPLIT</text>
    
    <!-- Character boxes -->
    <g transform="translate(150, 18)" font-family="ui-monospace, monospace" font-size="14" font-weight="600">
      <rect x="0" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="14" y="24" fill="#f8fafc" text-anchor="middle">u</text>

      <rect x="36" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="50" y="24" fill="#f8fafc" text-anchor="middle">n</text>

      <rect x="72" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="86" y="24" fill="#f8fafc" text-anchor="middle">d</text>

      <rect x="108" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="122" y="24" fill="#f8fafc" text-anchor="middle">e</text>

      <rect x="144" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="158" y="24" fill="#f8fafc" text-anchor="middle">r</text>

      <rect x="180" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="194" y="24" fill="#f8fafc" text-anchor="middle">s</text>

      <rect x="216" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="230" y="24" fill="#f8fafc" text-anchor="middle">t</text>

      <rect x="252" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="266" y="24" fill="#f8fafc" text-anchor="middle">a</text>

      <rect x="288" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="302" y="24" fill="#f8fafc" text-anchor="middle">n</text>

      <rect x="324" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="338" y="24" fill="#f8fafc" text-anchor="middle">d</text>

      <rect x="360" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="374" y="24" fill="#f8fafc" text-anchor="middle">i</text>

      <rect x="396" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="410" y="24" fill="#f8fafc" text-anchor="middle">n</text>

      <rect x="432" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="446" y="24" fill="#f8fafc" text-anchor="middle">g</text>

      <!-- Space indicator -->
      <rect x="472" y="0" width="34" height="38" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="1"/>
      <text x="489" y="24" fill="#818cf8" text-anchor="middle">Ġ</text>

      <rect x="514" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="528" y="24" fill="#f8fafc" text-anchor="middle">t</text>

      <rect x="550" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="564" y="24" fill="#f8fafc" text-anchor="middle">h</text>

      <rect x="586" y="0" width="28" height="38" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <text x="600" y="24" fill="#f8fafc" text-anchor="middle">e</text>
    </g>

    <text x="800" y="42" fill="#facc15" font-family="ui-monospace, monospace" font-size="12">17 characters</text>
  </g>

  <!-- CONNECTOR 2 -->
  <path d="M 495 289 L 495 319" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="491,317 495,325 499,317" fill="#facc15"/>

  <!-- STAGE 3: BPE MERGE PASS (SUBWORDS) -->
  <g transform="translate(50, 330)">
    <rect width="890" height="74" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)"/>
    <text x="24" y="42" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12" font-weight="600">SUBWORD MERGES</text>
    
    <g transform="translate(150, 18)" font-family="ui-monospace, monospace" font-size="14" font-weight="700">
      <!-- Token 1: "under" -->
      <rect x="0" y="0" width="110" height="38" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="55" y="24" fill="#38bdf8" text-anchor="middle">"under"</text>

      <!-- Token 2: "stand" -->
      <rect x="124" y="0" width="110" height="38" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
      <text x="179" y="24" fill="#c084fc" text-anchor="middle">"stand"</text>

      <!-- Token 3: "ing" -->
      <rect x="248" y="0" width="90" height="38" rx="6" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
      <text x="293" y="24" fill="#facc15" text-anchor="middle">"ing"</text>

      <!-- Token 4: " the" -->
      <rect x="352" y="0" width="100" height="38" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
      <text x="402" y="24" fill="#34d399" text-anchor="middle">" the"</text>
    </g>

    <text x="640" y="42" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Compressed to 4 tokens (~4.2x ratio)</text>
  </g>

  <!-- CONNECTOR 3 -->
  <path d="M 495 404 L 495 434" stroke="#475569" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="491,432 495,440 499,432" fill="#34d399"/>

  <!-- STAGE 4: DISCRETE TENSOR IDS -->
  <g transform="translate(50, 445)">
    <rect width="890" height="55" rx="12" fill="#0b1120" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="24" y="33" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">INTEGER ID TENSOR</text>
    
    <g transform="translate(200, 12)" font-family="ui-monospace, monospace" font-size="15" font-weight="700">
      <rect x="0" y="0" width="90" height="31" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="45" y="21" fill="#f8fafc" text-anchor="middle">2413</text>

      <rect x="105" y="0" width="90" height="31" rx="6" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="150" y="21" fill="#f8fafc" text-anchor="middle">4892</text>

      <rect x="210" y="0" width="90" height="31" rx="6" fill="#1e293b" stroke="#facc15" stroke-width="1"/>
      <text x="255" y="21" fill="#f8fafc" text-anchor="middle">278</text>

      <rect x="315" y="0" width="90" height="31" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
      <text x="360" y="21" fill="#f8fafc" text-anchor="middle">262</text>
    </g>

    <text x="640" y="33" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12">Input IDs ready for Embedding Lookup &gt;&gt;</text>
  </g>
</svg>
