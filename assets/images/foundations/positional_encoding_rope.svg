<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrowCyan3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGold3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#facc15"/>
    </marker>
    <marker id="arrowPurple3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" rx="16" fill="url(#bgGrad3)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Manim Grid -->
  <g opacity="0.10" stroke="#475569" stroke-width="0.8">
    <line x1="100" y1="0" x2="100" y2="520" stroke-dasharray="4 4"/>
    <line x1="300" y1="0" x2="300" y2="520" stroke-dasharray="4 4"/>
    <line x1="500" y1="0" x2="500" y2="520" stroke-dasharray="4 4"/>
    <line x1="700" y1="0" x2="700" y2="520" stroke-dasharray="4 4"/>
    <line x1="900" y1="0" x2="900" y2="520" stroke-dasharray="4 4"/>
    <line x1="0" y1="130" x2="1000" y2="130" stroke-dasharray="4 4"/>
    <line x1="0" y1="260" x2="1000" y2="260" stroke-dasharray="4 4"/>
    <line x1="0" y1="390" x2="1000" y2="390" stroke-dasharray="4 4"/>
  </g>

  <!-- Title -->
  <text x="50" y="48" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="0.5">POSITIONAL ENCODING: ABSOLUTE VS. ROTARY</text>
  <text x="50" y="72" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Breaking permutation symmetry: harmonic waves vs. geometric complex rotation</text>
  <rect x="780" y="32" width="170" height="28" rx="14" fill="#1e293b" stroke="#facc15" stroke-width="1.2"/>
  <text x="865" y="50" fill="#facc15" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">SINUSOIDAL &amp; RoPE</text>

  <!-- LEFT: SINUSOIDAL POSITIONAL ENCODING -->
  <g transform="translate(50, 100)">
    <rect width="425" height="390" rx="12" fill="url(#cardGrad3)" stroke="#334155" stroke-width="1.2" filter="url(#shadow3)"/>
    <text x="24" y="32" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Absolute Sinusoidal Encoding</text>
    <text x="24" y="50" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">Vaswani et al. (2017) — Fixed geometric harmonics</text>

    <!-- Waveform Area -->
    <g transform="translate(24, 70)">
      <!-- Wave 1 (High frequency: dim i=0) -->
      <path d="M 0 50 Q 20 10, 40 50 T 80 50 T 120 50 T 160 50 T 200 50 T 240 50 T 280 50 T 320 50 T 360 50" fill="none" stroke="#38bdf8" stroke-width="2.2"/>
      <text x="375" y="54" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">i = 0</text>

      <!-- Wave 2 (Medium frequency: dim i=2) -->
      <path d="M 0 110 Q 40 70, 80 110 T 160 110 T 240 110 T 320 110 T 360 110" fill="none" stroke="#facc15" stroke-width="2.2"/>
      <text x="375" y="114" fill="#facc15" font-family="ui-monospace, monospace" font-size="10">i = 2</text>

      <!-- Wave 3 (Low frequency: dim i=d/2) -->
      <path d="M 0 170 Q 90 130, 180 170 T 360 170" fill="none" stroke="#c084fc" stroke-width="2.2"/>
      <text x="375" y="174" fill="#c084fc" font-family="ui-monospace, monospace" font-size="10">i = d/2</text>

      <!-- Wave 4 (Lowest frequency: dim i=d) -->
      <path d="M 0 230 Q 180 200, 360 230" fill="none" stroke="#f43f5e" stroke-width="2.2"/>
      <text x="375" y="234" fill="#f43f5e" font-family="ui-monospace, monospace" font-size="10">i = d-1</text>

      <!-- Position markers -->
      <line x1="80" y1="20" x2="80" y2="250" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="80" y="265" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">pos = 1</text>

      <line x1="240" y1="20" x2="240" y2="250" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="240" y="265" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10" text-anchor="middle">pos = 4</text>
    </g>

    <!-- Formula Box -->
    <rect x="24" y="345" width="375" height="30" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="210" y="365" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">PE(pos, 2i) = sin(pos / 10000^(2i/d))</text>
  </g>

  <!-- RIGHT: ROTARY POSITION EMBEDDING (RoPE) -->
  <g transform="translate(525, 100)">
    <rect width="425" height="390" rx="12" fill="url(#cardGrad3)" stroke="#334155" stroke-width="1.2" filter="url(#shadow3)"/>
    <text x="24" y="32" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Rotary Position Embedding (RoPE)</text>
    <text x="24" y="50" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">Su et al. (2021) — 2D Complex plane rotation</text>

    <!-- Complex Plane Coordinate System -->
    <g transform="translate(195, 200)">
      <!-- Circle of unit rotation -->
      <circle cx="0" cy="0" r="105" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

      <!-- Axes -->
      <line x1="-120" y1="0" x2="120" y2="0" stroke="#475569" stroke-width="1.2"/>
      <line x1="0" y1="-120" x2="0" y2="120" stroke="#475569" stroke-width="1.2"/>
      <text x="125" y="4" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">Re</text>
      <text x="-4" y="-125" fill="#64748b" font-family="ui-monospace, monospace" font-size="10">Im</text>

      <!-- Original Vector x at pos 0 -->
      <line x1="0" y1="0" x2="80" y2="0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="88" y="15" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">x_0</text>

      <!-- Rotated Vector q at pos m (angle mθ) -->
      <line x1="0" y1="0" x2="70" y2="-65" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan3)"/>
      <text x="75" y="-72" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">R_m q</text>
      <!-- Arc mθ -->
      <path d="M 40 0 A 40 40 0 0 0 28 -28" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="44" y="-15" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10">mθ</text>

      <!-- Rotated Vector k at pos n (angle nθ) -->
      <line x1="0" y1="0" x2="-25" y2="-88" stroke="#facc15" stroke-width="2.5" marker-end="url(#arrowGold3)"/>
      <text x="-35" y="-95" fill="#facc15" font-family="ui-monospace, monospace" font-size="11" font-weight="700">R_n k</text>
      <!-- Arc relative (m - n)θ -->
      <path d="M 28 -28 A 40 40 0 0 0 -10 -38" fill="none" stroke="#f43f5e" stroke-width="2"/>
      <text x="0" y="-48" fill="#f43f5e" font-family="ui-monospace, monospace" font-size="9" font-weight="600">(m-n)θ</text>
    </g>

    <!-- Formula Box -->
    <rect x="24" y="345" width="375" height="30" rx="6" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="210" y="365" fill="#c7d2fe" font-family="ui-monospace, monospace" font-size="11" font-weight="600" text-anchor="middle">⟨R_m q, R_n k⟩ = q^T R_(n-m) k</text>
  </g>
</svg>
